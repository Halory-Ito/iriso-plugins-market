name: build-index

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.json'
      - 'index.json.sig'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The published-version check diffs against the base commit.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify packages (metadata, sandbox compliance, hashes)
        run: bun run verify

      - name: Check that index.json matches the packages
        run: bun run index:check

      - name: Reject edits to an already published version
        if: github.event_name == 'pull_request'
        run: bun scripts/check-published.mjs --against ${{ github.event.pull_request.base.sha }}
